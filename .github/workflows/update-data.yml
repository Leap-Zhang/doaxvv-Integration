name: Update DOAXVV data

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Fetch & regenerate data
        run: node tools/doax/update.mjs
      - name: Build
        run: pnpm build
      - name: Commit data changes
        run: |
          git config user.name "doax-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tools/doax/raw src/data public/data
          git diff --cached --quiet && echo "no data changes" || { git commit -m "chore: sync DOAXVV data"; git push; }
