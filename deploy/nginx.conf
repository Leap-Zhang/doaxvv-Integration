# DOAXVV 攻略站 · Nginx 静态站配置
# 用法：替换 server_name 为你的域名，放 /etc/nginx/sites-available/doaxvv

server {
    listen 80;
    listen [::]:80;
    server_name 你的域名.com;          # ← 改成你的域名

    root /var/www/doaxvv;              # ← 站点根目录（上传 dist 到这里）
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态大目录，合理缓存
    location /data/ { add_header Cache-Control 'public, max-age=3600'; try_files $uri $uri/ =404; }
    location /img/  { add_header Cache-Control 'public, max-age=604800'; try_files $uri $uri/ =404; }
    location /_astro/ { add_header Cache-Control 'public, max-age=604800'; try_files $uri =404; }

    # 页面本身不缓存，便于更新后立即生效
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 安全响应头（可选）
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}

# HTTPS 示例：备案通过 + 证书就绪后启用
