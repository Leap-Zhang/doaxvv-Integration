# 主站：根占位 + /looklook/doaxvv/ 子站（DOAXVV 攻略站）
server {
    server_name leapne.com www.leapne.com;
    root /var/www/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DOAXVV wiki 子路径（root 方式，避免 alias+try_files 坑）
    location /looklook/doaxvv/api/ { root /var/www; add_header Cache-Control 'public, max-age=3600'; try_files $uri =404; }
    location /looklook/doaxvv/img/  { root /var/www; add_header Cache-Control 'public, max-age=604800'; try_files $uri =404; }
    location /looklook/doaxvv/_astro/ { root /var/www; add_header Cache-Control 'public, max-age=604800'; try_files $uri =404; }
    location = /looklook/doaxvv { return 301 /looklook/doaxvv/; }

    location /looklook/doaxvv/ {
        root /var/www;
        try_files $uri $uri/ $uri.html /looklook/doaxvv/index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.leapne.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.leapne.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS (certbot)
server {
    if ($host = leapne.com) { return 301 https://$host$request_uri; }
    if ($host = www.leapne.com) { return 301 https://$host$request_uri; }
    listen 80;
    server_name leapne.com www.leapne.com;
    return 404;
}